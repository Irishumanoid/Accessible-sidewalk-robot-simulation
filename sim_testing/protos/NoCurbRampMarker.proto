#VRML_SIM R2025a utf8

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/traffic/protos/SignPole.proto"
EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/objects/traffic/protos/DirectionPanel.proto"

PROTO NoCurbRampMarker [
  field SFVec3f translation -0.831559 -16.2464 2.22474e-14
  field MFString texturePath ["../../assets/missingcurbramp.png"]
  field SFString name "no_curb_ramp_marker"
]
{
  DEF NO_CURB_RAMP_MARKER SignPole {
    translation IS translation
    name IS name
    height 4
    radius 0.05
    color  0.837415 0.422843 0
    signBoards [
      DirectionPanel {
        translation 0 0 3
        width 3
        height 3
        thickness 0.1
        frontTextTexture IS texturePath
        backTextTexture IS texturePath
      }
    ]
  }
}